name: Docker Publish

on:
  workflow_call:
    inputs:
      service:
        description: Service name, used as the image name suffix and cache scope
        type: string
        required: true
      context:
        description: Docker build context
        type: string
        required: true
      dockerfile:
        description: Path to the Dockerfile
        type: string
        required: true
      build-args:
        description: Newline-separated build args (KEY=VALUE)
        type: string
        required: false
        default: ""

jobs:
  build-publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set image tags
        id: meta
        env:
          SERVICE: ${{ inputs.service }}
        run: |
          image="${REGISTRY}/${GITHUB_REPOSITORY}/${SERVICE}"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "tags=${image}:latest,${image}:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/heads/release/* ]]; then
            echo "tags=${image}:${GITHUB_REF_NAME#release/}" >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${image}:feature" >> "$GITHUB_OUTPUT"
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker Login
        if: steps.meta.outputs.push == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # shortcut: GHA cache is capped at 10 GB per repo (LRU); if it thrashes,
      # switch to type=registry,ref=<image>:buildcache.
      - name: Docker build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.meta.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: ${{ inputs.build-args }}
          cache-from: type=gha,scope=${{ inputs.service }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}
